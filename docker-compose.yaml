version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    build:
      context: ./Frontend/Dashboard/dashboard-insideugal
      dockerfile: Dockerfile
    volumes:
      - ./Frontend/Dashboard/dashboard-insideugal:/app
      - /app/node_modules
    ports:
      - "8091:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      - backend
