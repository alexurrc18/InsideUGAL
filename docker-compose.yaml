# Minimal stack: frontend + Supabase Studio + postgres-meta + Postgres.
# supabase-db is required because supabase-meta/Studio need a database to manage.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:3001}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
    - 8001:8000
    networks:
    - public
    - internal
  llm:
    build:
      context: ./LLM
      dockerfile: Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:3001}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ALLOWED_ORIGINS: ${LLM_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
    - llm-uploads:/app/LLM/modul-marius/uploads
    - llm-chroma-data:/app/LLM/modul-marius/chroma_db
    ports:
    - 8002:8000
    networks:
    - public
    - internal
  frontend:
    build:
      context: ./Frontend/Dashboard/dashboard-insideugal
      dockerfile: Dockerfile
    environment:
    - NODE_ENV=production
    - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
    - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:3000/ >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
    - 3000:3000
    networks:
    - public
    - internal
    labels:
    - traefik.enable=true
    - traefik.docker.network=coolify
    - traefik.http.routers.insideugal-frontend.rule=Host(`insideugal.ro`)
    - traefik.http.routers.insideugal-frontend.entrypoints=https
    - traefik.http.routers.insideugal-frontend.tls=true
    - traefik.http.routers.insideugal-frontend-http.rule=Host(`insideugal.ro`)
    - traefik.http.routers.insideugal-frontend-http.entrypoints=http
    - traefik.http.routers.insideugal-frontend-http.middlewares=insideugal-redirect-https
    - traefik.http.routers.insideugal-frontend-http.service=insideugal-frontend
    - traefik.http.middlewares.insideugal-redirect-https.redirectscheme.scheme=https
    - traefik.http.services.insideugal-frontend.loadbalancer.server.port=3000
  supabase-db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d ${POSTGRES_DB:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
    - supabase-db-data:/var/lib/postgresql/data
    networks:
    - internal
  supabase-meta:
    image: supabase/postgres-meta:v0.95.2
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: '8080'
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: ${POSTGRES_PORT:-5432}
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-change-me}
    networks:
    - internal
  supabase-studio:
    image: supabase/studio:2026.03.16-sha-5528817
    restart: unless-stopped
    depends_on:
      supabase-meta:
        condition: service_started
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-change-me}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-InsideUGAL}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-InsideUGAL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:3001}
      SUPABASE_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3001
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SNIPPETS_MANAGEMENT_FOLDER: /tmp/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /tmp/edge-functions
    volumes:
    - ./supabase/snippets:/tmp/snippets
    - ./supabase/functions:/tmp/edge-functions
    ports:
    - 3001:3000
    networks:
    - public
    - internal
networks:
  public:
    name: coolify
    external: true
  internal:
    internal: true
volumes:
  supabase-db-data: {}
  llm-uploads: {}
  llm-chroma-data: {}
