version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: insideugal
      POSTGRES_PASSWORD: insideugal123
      POSTGRES_DB: insideugal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insideugal -d insideugal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://insideugal:insideugal123@db:5432/insideugal
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend/Dashboard/dashboard-insideugal
      dockerfile: Dockerfile
    volumes:
      - ./Frontend/Dashboard/dashboard-insideugal:/app
      - /app/node_modules
    ports:
      - "8091:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      - backend

volumes:
  postgres_data:
