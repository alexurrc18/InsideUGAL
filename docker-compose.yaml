version: '3.8'

services:
  # Backend - Echipa Python FastAPI + LLM Gemini
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8080:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Frontend-ul React comunica cu Backend-ul Python si cu Supabase direct
      - VITE_API_URL=http://localhost:8000
      - VITE_SUPABASE_URL=http://localhost:54321
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-cheie_anonima_local}
    depends_on:
      - backend