services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      SUPABASE_URL: ${SUPABASE_URL:-http://supabase-kong:8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-kong:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
    - 8002:8000
    networks:
    - public
    - internal

  llm:
    build:
      context: ./LLM
      dockerfile: Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      SUPABASE_URL: ${SUPABASE_URL:-http://supabase-kong:8000}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ALLOWED_ORIGINS: ${LLM_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-kong:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
    - 8001:8000
    networks:
    - public
    - internal

  frontend:
    build:
      context: ./Frontend/Dashboard/dashboard-insideugal
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-http://localhost:54321}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-cheie_anonima_local}
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:3000/ >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "5173:5173"
      - "8080:80"
      - "8091:3000"
      - "3000:3000"
    networks:
    - public
    - internal
    labels:
    - traefik.enable=true
    - traefik.docker.network=coolify
    - traefik.http.routers.insideugal-frontend.rule=Host(insideugal.ro)
    - traefik.http.routers.insideugal-frontend.entrypoints=https
    - traefik.http.routers.insideugal-frontend.tls=true
    - traefik.http.routers.insideugal-frontend-http.rule=Host(insideugal.ro)
    - traefik.http.routers.insideugal-frontend-http.entrypoints=http
    - traefik.http.routers.insideugal-frontend-http.middlewares=insideugal-redirect-https
    - traefik.http.routers.insideugal-frontend-http.service=insideugal-frontend
    - traefik.http.middlewares.insideugal-redirect-https.redirectscheme.scheme=https
    - traefik.http.services.insideugal-frontend.loadbalancer.server.port=3000

  supabase-db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d ${POSTGRES_DB:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
    - supabase-db-data:/var/lib/postgresql/data
    - ./supabase/migrations/00_init_roles.sql:/docker-entrypoint-initdb.d/00_init_roles.sql:ro
    - ./supabase/migrations/202605280001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    - ./supabase/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
    - internal
  supabase-auth:
    image: supabase/gotrue:v2.188.1
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}?sslmode=disable
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      API_EXTERNAL_URL: http://localhost:8004/auth/v1
      GOTRUE_API_EXTERNAL_URL: http://localhost:8004/auth/v1
      GOTRUE_DB_MAX_POOL_SIZE: 20
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    networks:
      - internal
  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_ANON_ROLE: anon
    networks:
      - internal
  supabase-kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    ports:
      - 8004:8000
    networks:
      - public
      - internal
  supabase-meta:
    image: supabase/postgres-meta:v0.95.2
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: '8080'
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: ${POSTGRES_PORT:-5432}
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-change-me}
    networks:
    - internal

  supabase-studio:
    image: supabase/studio:2026.03.16-sha-5528817
    restart: unless-stopped
    depends_on:
      supabase-meta:
        condition: service_started
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-change-me}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-InsideUGAL}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-InsideUGAL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8082}
      SUPABASE_URL: http://localhost:8082
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8082
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SNIPPETS_MANAGEMENT_FOLDER: /tmp/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /tmp/edge-functions
    volumes:
    - ./supabase/snippets:/tmp/snippets
    - ./supabase/functions:/tmp/edge-functions
    ports:
    - 8082:3000
    networks:
    - public
    - internal

  mobile:
    build:
      context: ./Frontend/Mobile
      dockerfile: Dockerfile
    command: npm run web -- --host lan
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - CI=1
      - EXPO_NO_TELEMETRY=1
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost
    healthcheck:
      test:
      - CMD-SHELL
      - node -e "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - internal
      - public
    labels:
      - traefik.enable=false
networks:
  public:
    name: coolify
    external: true
  internal:
    internal: true

volumes:
  supabase-db-data: {}