name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/Dashboard/dashboard-insideugal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/Dashboard/dashboard-insideugal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect FastAPI backend
        id: detect
        shell: bash
        run: |
          if [ -f app/main.py ] || [ -f app/pyproject.toml ] || [ -f app/requirements.txt ]; then
            echo "path=app" >> "$GITHUB_OUTPUT"
          elif [ -f backend/app/main.py ] || [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; then
            echo "path=backend" >> "$GITHUB_OUTPUT"
          elif [ -f Backend/app/main.py ] || [ -f Backend/pyproject.toml ] || [ -f Backend/requirements.txt ]; then
            echo "path=Backend" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Backend missing
        if: steps.detect.outputs.path == ''
        run: |
          echo "::warning::No FastAPI backend module found at app/main.py, app/pyproject.toml, app/requirements.txt, backend/app/main.py, backend/pyproject.toml or backend/requirements.txt. Skipping backend CI until the backend team ships runnable code."

      - name: Setup Python
        if: steps.detect.outputs.path != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.detect.outputs.path != ''
        working-directory: ${{ steps.detect.outputs.path }}
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          fi

          pip install ruff mypy

      - name: Lint
        if: steps.detect.outputs.path != ''
        working-directory: ${{ steps.detect.outputs.path }}
        shell: bash
        run: ruff check .

      - name: Typecheck
        if: steps.detect.outputs.path != ''
        working-directory: ${{ steps.detect.outputs.path }}
        shell: bash
        run: mypy .

      - name: Build
        if: steps.detect.outputs.path != ''
        working-directory: ${{ steps.detect.outputs.path }}
        run: python -m compileall .
