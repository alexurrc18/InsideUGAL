name: Security Audit

on:
  push:
    branches: [ infra/raul, Infrastructura ]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  audit-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements.txt'
      - name: Run pip-audit
        run: |
          pip install pip-audit
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt
          else
            echo "::warning::No requirements.txt found. Skipping."
          fi

  audit-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/Dashboard/dashboard-insideugal/package-lock.json
      - name: Install dependencies
        run: |
          cd Frontend/Dashboard/dashboard-insideugal
          npm ci
      - name: Run npm audit
        run: |
          cd Frontend/Dashboard/dashboard-insideugal
          npm audit --audit-level=high